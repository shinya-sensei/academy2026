<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>当日受付チェックイン</title>
  <style>
    :root {
      --primary-color: #007aff;
      --success-color: #34c759;
      --bg-color: #f2f2f7;
      --card-bg: #ffffff;
      --border-color: #e5e5ea;
    }
    
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      margin: 0;
      padding: 16px;
      color: #1c1c1e;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    h1 {
      font-size: 22px;
      text-align: center;
      margin-top: 8px;
      margin-bottom: 16px;
      color: #000;
      font-weight: 700;
    }

    /* 検索ボックス固定 */
    .search-box {
      position: sticky;
      top: 0;
      background: var(--bg-color);
      padding-bottom: 12px;
      z-index: 10;
    }

    .search-input {
      width: 100%;
      padding: 14px 16px;
      font-size: 16px;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      background: var(--card-bg);
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      outline: none;
    }

    .search-input:focus {
      border-color: var(--primary-color);
    }

    /* 結果カード一覧 */
    .result-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
      border: 1px solid var(--border-color);
    }

    .card.checked {
      background-color: #eefbf1;
      border-color: #b7edc5;
    }

    .info {
      flex: 1;
      padding-right: 12px;
    }

    .seat-badge {
      display: inline-block;
      background: #007aff;
      color: #ffffff;
      font-weight: bold;
      font-size: 14px;
      padding: 3px 8px;
      border-radius: 6px;
      margin-bottom: 6px;
    }

    .name {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 2px;
    }

    .furigana {
      font-size: 12px;
      color: #8e8e93;
      margin-bottom: 6px;
    }

    .tanto {
      font-size: 13px;
      color: #3a3a3c;
    }

    /* 操作ボタン */
    .btn {
      padding: 12px 18px;
      font-size: 15px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-check {
      background: var(--primary-color);
      color: white;
    }

    .btn-done {
      background: var(--success-color);
      color: white;
      cursor: default;
    }

    .btn-map {
      background: #e5e5ea;
      color: #007aff;
      margin-top: 8px;
      font-size: 12px;
      padding: 5px 10px;
      border-radius: 6px;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }

    /* 座席マップ用モーダル */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.55);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 16px;
    }

    .modal-content {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 20px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }

    .seat-map-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin: 16px 0;
    }

    .seat-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2px;
      background: #e5e5ea;
      padding: 4px;
      border-radius: 6px;
    }

    .seat-cell {
      background: white;
      font-size: 11px;
      padding: 8px 0;
      border-radius: 4px;
      font-weight: bold;
      color: #8e8e93;
    }

    .seat-cell.active {
      background: #ff3b30;
      color: white;
      animation: pulse 0.8s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); box-shadow: 0 0 0 rgba(255,59,48,0.4); }
      to { transform: scale(1.1); box-shadow: 0 0 8px rgba(255,59,48,0.8); }
    }

    .close-btn {
      background: #8e8e93;
      color: white;
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: bold;
      border: none;
      margin-top: 8px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>当日受付チェックイン</h1>
  
  <div class="search-box">
    <input type="text" id="searchInput" class="search-input" placeholder="ふりがな・名前で検索..." oninput="handleSearch()">
  </div>

  <div id="resultList" class="result-list">
    <div style="text-align:center; padding: 30px; color:#8e8e93;">データを読み込み中...</div>
  </div>
</div>

<!-- 座席図モーダル -->
<div id="mapModal" class="modal-overlay">
  <div class="modal-content">
    <h3 id="modalTargetName" style="margin:0 0 4px 0; font-size:18px;"></h3>
    <div style="font-size:15px; color:#3a3a3c;">指定席: <strong id="modalTargetSeat" style="color:#ff3b30; font-size:18px;"></strong></div>
    
    <!-- 座席配置図（A列、B/C列、D/E列、F/G列、H列） -->
    <div class="seat-map-grid">
      <div class="seat-group" id="col-A"></div>
      <div class="seat-group" id="col-BC"></div>
      <div class="seat-group" id="col-DE"></div>
      <div class="seat-group" id="col-FG"></div>
      <div class="seat-group" id="col-H"></div>
    </div>

    <button class="close-btn" onclick="closeMap()">閉じる</button>
  </div>
</div>

<script>
  // 指定いただいたWebアプリURL
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyMtegvOPGMAKSldzFmM-9859ay6scX7fN5o88oewCFonR0kQ-n8rEnMvlq_Vh75P5S/exec";

  let attendeeData = [];

  // ひらがな・カタカナ・全角半角スペースを統一して曖昧検索を行う関数
  function normalizeText(str) {
    if (!str) return '';
    return str.replace(/[\u30a1-\u30f6]/g, match => String.fromCharCode(match.charCodeAt(0) - 0x60))
              .replace(/[\s ]+/g, '')
              .toLowerCase();
  }

  // 初回データ読み込み
  async function loadData() {
    try {
      const res = await fetch(GAS_API_URL);
      attendeeData = await res.json();
      renderList(attendeeData);
    } catch (err) {
      document.getElementById('resultList').innerHTML = '<div style="text-align:center; color:#ff3b30; padding:20px;">データの読み込みに失敗しました</div>';
    }
  }

  // 参加者カードリスト描画
  function renderList(list) {
    const container = document.getElementById('resultList');
    if (!list || list.length === 0) {
      container.innerHTML = '<div style="text-align:center; padding: 30px; color:#8e8e93;">該当する参加者が見つかりません</div>';
      return;
    }

    container.innerHTML = list.map(item => `
      <div class="card ${item.checked ? 'checked' : ''}">
        <div class="info">
          <span class="seat-badge">${item.seat}席</span>
          <div class="name">${item.name} 様</div>
          <div class="furigana">${item.furigana}</div>
          <div class="tanto">担当: <strong>${item.tanto}</strong></div>
          ${item.seat && item.seat !== '-' && !item.seat.includes('空席') 
            ? `<button class="btn-map" onclick="openMap('${item.seat}', '${item.name}')">📍 席の場所を確認</button>` 
            : ''}
        </div>
        <div>
          ${item.checked 
            ? `<button class="btn btn-done">受付済 ⭕️️</button>`
            : `<button class="btn btn-check" onclick="checkIn(${item.rowIndex}, this)">受付</button>`
          }
        </div>
      </div>
    `).join('');
  }

  // リアルタイム検索（ふりがな・漢字・席番号に対応）
  function handleSearch() {
    const query = normalizeText(document.getElementById('searchInput').value);
    if (!query) {
      renderList(attendeeData);
      return;
    }

    const filtered = attendeeData.filter(item => {
      const nameNorm = normalizeText(item.name);
      const furiNorm = normalizeText(item.furigana);
      const seatNorm = normalizeText(item.seat);
      return nameNorm.includes(query) || furiNorm.includes(query) || seatNorm.includes(query);
    });

    renderList(filtered);
  }

  // 受付ボタン押下時の処理（E列へ⭕️️を送信）
  async function checkIn(rowIndex, btnElement) {
    btnElement.disabled = true;
    btnElement.textContent = "送信中...";

    try {
      await fetch(GAS_API_URL, {
        method: "POST",
        body: JSON.stringify({ rowIndex: rowIndex })
      });

      // ローカル側のデータを更新して表示反映
      const target = attendeeData.find(item => item.rowIndex === rowIndex);
      if (target) target.checked = true;

      handleSearch();
    } catch (err) {
      alert("受付処理に失敗しました。再送信してください。");
      btnElement.disabled = false;
      btnElement.textContent = "受付";
    }
  }

  // 座席マップ生成と指定席のハイライト表示
  function openMap(targetSeat, name) {
    document.getElementById('modalTargetName').textContent = name + " 様";
    document.getElementById('modalTargetSeat').textContent = targetSeat + "席";

    const cols = {
      'col-A': ['A'],
      'col-BC': ['B', 'C'],
      'col-DE': ['D', 'E'],
      'col-FG': ['F', 'G'],
      'col-H': ['H']
    };

    for (let colId in cols) {
      const container = document.getElementById(colId);
      container.innerHTML = '';
      const letters = cols[colId];

      for (let r = 1; r <= 6; r++) {
        letters.forEach(l => {
          const seatCode = `${l}${r}`;
          const cell = document.createElement('div');
          cell.className = `seat-cell ${seatCode === targetSeat ? 'active' : ''}`;
          cell.textContent = seatCode;
          container.appendChild(cell);
        });
      }
    }

    document.getElementById('mapModal').style.display = 'flex';
  }

  function closeMap() {
    document.getElementById('mapModal').style.display = 'none';
  }

  // ページロード時にデータ取得開始
  loadData();
</script>

</body>
</html>
